<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call QA Tagger</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d2328; --muted: #66707a; --line: #e2e0da;
  --accent: #1f5f73; --accent-ink: #ffffff; --agent: #e8f1f4; --caller: #f3efe6; --system: #f1f1f1;
  --yes: #2e7d4f; --no: #b3402f; --na: #6b6f75; --warn: #9a6b00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181b; --panel: #1c2226; --ink: #e6e9eb; --muted: #97a1a9; --line: #2c343a;
    --accent: #5fb0c7; --accent-ink: #0d1316; --agent: #1d2f36; --caller: #2c2820; --system: #23282c;
    --yes: #5cc28a; --no: #e37a69; --na: #9aa0a6; --warn: #e0b04a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
.pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; max-width: 220px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.spacer { flex: 1; }
main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 360px; height: calc(100vh - 49px); }
nav { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
nav button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; padding: 9px 14px;
  border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; font: inherit; }
nav button:hover { background: var(--bg); }
nav button[aria-current="true"] { background: var(--agent); font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
.dot.partial { background: var(--warn); border-color: var(--warn); }
.dot.done { background: var(--yes); border-color: var(--yes); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
#transcript { overflow-y: auto; padding: 16px 20px 40px; }
.turn { max-width: 760px; margin: 0 0 10px; padding: 8px 12px; border-radius: 8px; background: var(--caller); }
.turn.agent { background: var(--agent); }
.turn.system { background: var(--system); color: var(--muted); font-size: 13px; }
.turn .who { font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
mark { background: #f5d76e; color: #1d2328; border-radius: 2px; }
.search { display: flex; gap: 8px; margin-bottom: 12px; max-width: 760px; }
.search input { flex: 1; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 16px 0; }
.item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-name { font-weight: 600; }
.hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { border: 0; background: none; padding: 4px 10px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="Yes"] { background: var(--yes); color: #fff; }
.seg button[aria-pressed="true"][data-v="No"] { background: var(--no); color: #fff; }
.seg button[aria-pressed="true"][data-v="N/A"] { background: var(--na); color: #fff; }
.seg.wide { display: flex; } .seg.wide button { flex: 1; }
.seg.wide button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
label.block { display: block; font-weight: 600; margin: 12px 0 6px; }
select, textarea, input { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { min-height: 70px; resize: vertical; }
.actions { position: sticky; bottom: 0; background: var(--panel); padding: 12px 0 14px; margin-top: 12px;
  display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px;
  padding: 7px 12px; font: inherit; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.status { font-size: 12px; color: var(--muted); }
.status.dirty { color: var(--warn); } .status.err { color: var(--no); }
kbd { font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  nav button { width: auto; flex: none; border-bottom: 0; border-right: 1px solid var(--line); }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 14px 16px 24px; }
  #transcript { padding: 16px; }
  .bar, .keys, .spacer { display: none; }
  header { flex-wrap: wrap; gap: 8px; }
}
</style>
</head>
<body>
<header>
  <h1>Call QA Tagger</h1>
  <span class="pill" id="rater"></span>
  <span class="pill" id="source"></span>
  <div class="bar" aria-hidden="true"><div id="barfill"></div></div>
  <span class="status" id="progress"></span>
  <span class="spacer"></span>
  <span class="status keys"><kbd>⌘/Ctrl</kbd>+<kbd>S</kbd> save · <kbd>Alt</kbd>+<kbd>↑↓</kbd> calls</span>
</header>
<main>
  <nav id="list" aria-label="Calls"></nav>
  <section id="transcript" aria-label="Transcript">
    <div class="search"><input id="find" type="search" placeholder="Highlight words in transcript…"></div>
    <div id="turns"></div>
  </section>
  <aside>
    <div class="mono" id="callid"></div>
    <div id="items"></div>
    <label class="block">Caller sentiment</label>
    <div id="sentiment"></div>
    <label class="block" for="outcome">Call outcome</label>
    <select id="outcome"></select>
    <label class="block" for="notes">Notes</label>
    <textarea id="notes" placeholder="Anything ambiguous, e.g. why N/A, garbled audio…"></textarea>
    <div class="actions">
      <button class="btn" id="prev">← Prev</button>
      <button class="btn primary" id="save">Save &amp; next</button>
      <span class="status" id="status"></span>
    </div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let S = { config: null, calls: [], labels: {}, idx: 0, form: {}, dirty: false };

const LABEL = {
  greeting: "Appropriate greeting", culture: "Culture & values", capturing_data: "Captures key data",
  understanding_needs: "Understands needs", correct_info: "Correct information",
  first_contact_resolution: "First-contact resolution", compliance: "Privacy compliance",
};

async function load() {
  const r = await fetch("/api/state");
  const d = await r.json();
  S.config = d.config; S.calls = d.calls; S.labels = d.labels;
  $("rater").textContent = "Rater: " + S.config.rater;
  $("source").textContent = S.config.source;
  const firstOpen = S.calls.findIndex((c) => status(c.file_id) !== "done");
  buildForm();
  show(firstOpen === -1 ? 0 : firstOpen);
}

function status(fid) {
  const l = S.labels[fid];
  if (!l) return "none";
  const keys = [...S.config.items, "sentiment", "outcome"];
  const filled = keys.filter((k) => l[k]).length;
  return filled === keys.length ? "done" : filled ? "partial" : "none";
}

function renderList() {
  $("list").innerHTML = "";
  S.calls.forEach((c, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-current", i === S.idx);
    b.innerHTML = `<span class="dot ${status(c.file_id)}"></span><span class="mono">${i + 1}. ${c.file_id.slice(0, 8)}</span>`;
    b.onclick = () => guard(() => show(i));
    $("list").appendChild(b);
  });
  const done = S.calls.filter((c) => status(c.file_id) === "done").length;
  $("progress").textContent = `${done}/${S.calls.length} tagged`;
  $("barfill").style.width = (100 * done / Math.max(S.calls.length, 1)) + "%";
}

function seg(container, values, key, cls) {
  const wrap = document.createElement("div");
  wrap.className = "seg" + (cls ? " " + cls : "");
  values.forEach((v) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.v = v; b.dataset.k = key; b.textContent = v;
    b.onclick = () => { S.form[key] = S.form[key] === v ? "" : v; markDirty(); paint(); };
    wrap.appendChild(b);
  });
  container.appendChild(wrap);
}

function buildForm() {
  const items = $("items");
  S.config.items.forEach((k) => {
    const d = document.createElement("div"); d.className = "item";
    const head = document.createElement("div"); head.className = "item-head";
    head.innerHTML = `<span class="item-name">${LABEL[k] || k}</span>`;
    seg(head, ["Yes", "No", "N/A"], k);
    d.appendChild(head);
    const h = document.createElement("div"); h.className = "hint"; h.textContent = S.config.definitions[k];
    d.appendChild(h);
    items.appendChild(d);
  });
  seg($("sentiment"), S.config.sentiments, "sentiment", "");
  $("sentiment").querySelector(".seg").classList.add("wide");
  const o = $("outcome");
  o.innerHTML = `<option value="">— select —</option>` +
    S.config.outcomes.map((x) => `<option value="${x}">${x.replaceAll("_", " ")}</option>`).join("");
  o.onchange = () => { S.form.outcome = o.value; markDirty(); };
  $("notes").oninput = () => { S.form.notes = $("notes").value; markDirty(); };
}

function paint() {
  document.querySelectorAll("aside .seg button").forEach((b) => {
    b.setAttribute("aria-pressed", S.form[b.dataset.k] === b.dataset.v);
  });
  $("outcome").value = S.form.outcome || "";
  $("notes").value = S.form.notes || "";
}

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderTranscript() {
  const call = S.calls[S.idx];
  const q = $("find").value.trim();
  const re = q ? new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi") : null;
  const html = call.text.split(/\n\s*\n/).filter(Boolean).map((block) => {
    const m = block.match(/^([^:\n]{1,45}):\s*([\s\S]*)$/);
    let who = m ? m[1] : "", body = m ? m[2] : block;
    const kind = /^agent/i.test(who) ? "agent" : (/automated|system/i.test(who) || !m ? "system" : "caller");
    body = esc(body); if (re) body = body.replace(re, "<mark>$1</mark>");
    return `<div class="turn ${kind}">${who ? `<div class="who">${esc(who)}</div>` : ""}${body}</div>`;
  }).join("");
  $("turns").innerHTML = html;
}

function show(i) {
  S.idx = i;
  const call = S.calls[i];
  S.form = { ...(S.labels[call.file_id] || {}) };
  S.dirty = false;
  $("callid").textContent = call.file_id;
  $("status").textContent = status(call.file_id) === "done" ? "Saved" : "";
  $("status").className = "status";
  $("transcript").scrollTop = 0;
  renderTranscript(); paint(); renderList();
}

function markDirty() { S.dirty = true; $("status").textContent = "Unsaved changes"; $("status").className = "status dirty"; }

function guard(fn) {
  if (S.dirty && !confirm("You have unsaved changes on this call. Discard them?")) return;
  fn();
}

async function save(advance) {
  const call = S.calls[S.idx];
  const r = await fetch("/api/label", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ file_id: call.file_id, values: S.form }) });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    $("status").textContent = "Save failed: " + (e.error || r.status); $("status").className = "status err"; return;
  }
  S.labels[call.file_id] = { ...S.form };
  S.dirty = false;
  $("status").textContent = "Saved"; $("status").className = "status";
  renderList();
  if (advance && S.idx < S.calls.length - 1) show(S.idx + 1);
}

$("save").onclick = () => save(true);
$("prev").onclick = () => guard(() => show(Math.max(0, S.idx - 1)));
$("find").oninput = renderTranscript;
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(false); }
  if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); guard(() => show(Math.min(S.calls.length - 1, S.idx + 1))); }
  if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); guard(() => show(Math.max(0, S.idx - 1))); }
});
window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
load();
</script>
</body>
</html>
