<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Call QA Review</title>
<link rel="icon" href="/brand/logo">
<style>
:root {
  /* Salud brand: lime #8cc63e and grey #a7a9ac from the logo. Lime is decoration only (2:1 on white);
     text and buttons use the darker greens below, which pass WCAG AA on white. */
  --brand: #8cc63e; --brand-grey: #a7a9ac;
  --bg: #ffffff; --panel: #ffffff; --panel-2: #f7f9f4; --ink: #1c2617; --muted: #5d6468; --faint: #7d848a;
  --line: #e4e8df; --accent: #4f7a1c; --accent-hover: #3f6316; --accent-soft: #f2f8ea; --accent-ink: #ffffff;
  --agent: #f3f8ec; --caller: #f5f6f7; --system: #fafafa;
  --yes: #4f7a1c; --yes-soft: #eaf4dc; --no: #b3261e; --no-soft: #fbe9e7; --na: #5d6468; --na-soft: #eff1f2;
  --ai: #0f6b73; --ai-soft: #e6f3f4; --warn: #8a5a00; --warn-soft: #fdf3dc;
  --pos: #1e3a8a; --neg: #991b1b;   /* turn sentiment: dark blue positive, dark red negative */
  --pos-soft: #e8eefb; --neg-soft: #fbeaea;
  --hl: #c9e69a; --hl-ink: #1c2617; --shadow: 0 1px 2px rgba(28,38,23,.05), 0 2px 6px rgba(28,38,23,.06);
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; }

/* Header */
header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--panel);
  border-bottom: 1px solid var(--line); box-shadow: inset 0 3px 0 var(--brand); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { height: 36px; max-width: 160px; object-fit: contain; }
.mono-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--ink);
  display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .02em; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sub { color: var(--muted); font-size: 12px; }
.progress { display: flex; align-items: center; gap: 10px; margin-left: 12px; }
.bar { width: 160px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--brand); width: 0; transition: width .25s; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--panel); white-space: nowrap; }
.chip.ai { color: var(--ai); border-color: color-mix(in srgb, var(--ai) 35%, var(--line)); background: var(--ai-soft); }
.chip.off { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.loading .pulse { animation: pulse 1s infinite ease-in-out; }
@keyframes pulse { 50% { opacity: .25; } }

/* Body grid */
.body { display: grid; grid-template-columns: clamp(170px, 16vw, 240px) minmax(0, 1fr) clamp(300px, 30vw, 420px); min-height: 0; }
nav { background: var(--panel); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; }
.filters { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.filters .lbl { font-size: 11px; font-weight: 650; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.ftabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-2); }
.ftabs button { flex: 1; border: 0; background: none; padding: 5px 4px; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.ftabs button + button { border-left: 1px solid var(--line); }
.ftabs button .n { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ftabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ftabs button[aria-pressed="true"] .n { color: var(--accent-ink); opacity: .85; }
.filters select, .filters input { width: 100%; font-size: 13px; padding: 6px 8px; }
#list { overflow-y: auto; }
#list button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; padding: 8px 12px;
  border: 0; background: none; cursor: pointer; border-left: 3px solid transparent; }
#list button:hover { background: var(--panel-2); }
#list button[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--brand); font-weight: 600; }
#list .fid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src { font-size: 10px; font-weight: 650; letter-spacing: .03em; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; flex: none; }
.src.real { background: var(--yes-soft); color: var(--accent-hover); }
.src.synthetic { background: var(--na-soft); color: var(--muted); }
.list-foot { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.list-empty { padding: 16px 12px; color: var(--muted); font-size: 13px; }
.who-as { font-size: 10px; color: var(--faint); white-space: nowrap; flex: none; margin-left: auto; }
.who-as + .dot { margin-left: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; margin-left: auto; }
.dot.partial { background: var(--warn); border-color: var(--warn); }
.dot.done { background: var(--yes); border-color: var(--yes); }

.center { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; }
.toolbar { display: flex; gap: 10px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.toolbar input { flex: 1; max-width: 420px; }
.toolbar .fid { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#transcript { overflow-y: auto; padding: 18px 20px 28px; scroll-behavior: smooth; }
.summary { margin: 0 0 16px; padding: 12px 14px; border-radius: var(--radius); background: var(--ai-soft);
  border: 1px solid color-mix(in srgb, var(--ai) 25%, transparent); display: flex; gap: 10px; }
.summary .tag { color: var(--ai); font-weight: 650; font-size: 12px; white-space: nowrap; }
.turn { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; margin: 0 0 8px; }
.turn .tn { font-size: 11px; color: var(--faint); text-align: right; padding-top: 10px; font-variant-numeric: tabular-nums; }
.turn .bubble { padding: 8px 12px; border-radius: var(--radius); background: var(--caller); border: 1px solid #eceef0; transition: box-shadow .2s, border-color .2s; }
.turn.agent .bubble { background: var(--agent); border-color: #e3efd3; }
.turn.system .bubble { background: var(--system); color: var(--muted); font-size: 13px; }
.turn .who { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.turn.cited .bubble { border-color: color-mix(in srgb, var(--ai) 45%, transparent); }
.turn.flash .bubble { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ai) 45%, transparent); }
.turn.scored .bubble { border-left: 3px solid var(--tint); }
.turn .who { display: flex; align-items: center; gap: 8px; }
.sscore { margin-left: auto; font-size: 11px; font-weight: 650; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums;
  padding: 0 7px; border-radius: 999px; line-height: 18px; }
.sscore.neg { color: var(--neg); background: var(--neg-soft); }
.sscore.pos { color: var(--pos); background: var(--pos-soft); }
.sscore.neu { color: var(--muted); background: var(--na-soft); }
/* Caller sentiment: a card fixed between the toolbar and the transcript, which scrolls on its own */
#senti:not(:empty) { margin: 12px 20px 0; border: 1px solid #c9d3bd; border-radius: var(--radius); background: var(--panel);
  box-shadow: var(--shadow); overflow: hidden; }
.senti-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; font-size: 12.5px; padding: 7px 14px;
  background: var(--panel-2); border-bottom: 1px solid #dfe5d6; }
.senti-head .tag { font-weight: 750; font-size: 12px; color: var(--ink); text-transform: uppercase; letter-spacing: .05em; cursor: help;
  padding-right: 14px; border-right: 1px solid #d3dbc8; }
.senti-head .big { font-weight: 750; font-size: 13px; }
.senti-head .muted { color: var(--ink); font-weight: 600; opacity: .75; }
.senti-head .right { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); font-weight: 600; }
.senti-head button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--accent); font-size: 12.5px; font-weight: 650; }
.senti-head .key { display: inline-flex; align-items: center; gap: 4px; }
.senti-head .key i { display: inline-block; width: 14px; height: 0; border-top: 2.5px solid var(--ink); opacity: .75; }
.senti-head .key i.agent { border-top: 2px dashed var(--faint); }
.senti-chart { padding: 4px 14px 6px; }
.senti-chart svg { display: block; width: 100%; }
.senti-chart svg circle { cursor: pointer; }
mark { background: var(--hl); color: var(--hl-ink); border-radius: 3px; padding: 0 2px; box-shadow: inset 0 -2px 0 var(--accent); }
mark.find { background: #fff1a8; color: inherit; }

/* Coaching panel */
.coach { border-top: 1px solid var(--line); background: var(--panel); }
.coach summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 20px; font-weight: 650; }
.coach summary::-webkit-details-marker { display: none; }
.coach summary .caret { transition: transform .15s; color: var(--faint); }
.coach[open] summary .caret { transform: rotate(90deg); }
.coach .count { font-weight: 500; color: var(--muted); font-size: 12px; }
.tips { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; padding: 0 20px 14px; max-height: clamp(90px, 24vh, 220px); overflow-y: auto; }
.tip { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--panel-2); }
.tip .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.tip .item { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--ai); }
.tip button { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }
.empty { color: var(--muted); font-size: 13px; padding: 0 20px 14px; }

/* Checklist panel */
aside { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; }
.scroll { overflow-y: auto; overflow-x: hidden; padding: 14px 16px 16px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 10px; }
.section-title h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.banner { font-size: 12px; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; background: var(--warn-soft); color: var(--warn); }
.banner.err { background: var(--no-soft); color: var(--no); }
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; background: var(--panel); cursor: default; transition: border-color .15s, box-shadow .15s; }
.card:hover, .card.active { border-color: color-mix(in srgb, var(--ai) 45%, var(--line)); }
.card.active { box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px 8px; flex-wrap: wrap; }
.card-name { font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; min-width: 0; }
.card { min-width: 0; }
#transcript, nav, #list { overflow-x: hidden; }
.info { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); color: var(--faint); font-size: 10px; display: inline-grid; place-items: center; cursor: help; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; background: var(--panel-2); }
.seg button { position: relative; border: 0; background: none; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg button[aria-pressed="true"][data-v="Yes"] { background: var(--yes); color: #fff; }
.seg button[aria-pressed="true"][data-v="No"] { background: var(--no); color: #fff; }
.seg button[aria-pressed="true"][data-v="N/A"] { background: var(--na); color: #fff; }
.seg button.sugg::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--ai); }
.seg.wide { display: flex; } .seg.wide button { flex: 1; }
.seg.wide button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.reason { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.reason .ai { color: var(--ai); font-weight: 650; }
.changed { font-size: 11px; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 1px 8px; }
/* AI could not determine an answer: red until the rater answers, then a red badge remains. */
/* Needs review: the AI's answer has no supporting transcript text (or there is no AI answer).
   Red until the rater picks an answer themself, then green. */
.flag { font-size: 11px; font-weight: 650; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.flag.need { color: var(--no); background: #fff; border: 1px solid color-mix(in srgb, var(--no) 45%, transparent); }
.flag.done { color: var(--accent-hover); background: #fff; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.card.needs-review, .field.needs-review { background: #fdecea; border-color: #e8a59c; box-shadow: inset 4px 0 0 var(--no); }
.card.checked, .field.checked { background: var(--yes-soft); border-color: #b9d99a; box-shadow: inset 4px 0 0 var(--accent); }
.field { border: 1px solid transparent; border-radius: var(--radius); padding: 8px 10px; transition: background .2s, border-color .2s; }
.reason .need-msg { color: var(--no); font-weight: 600; display: block; }
.reason .done-msg { color: var(--accent-hover); font-weight: 600; display: block; }
.banner.err-soft { background: var(--no-soft); color: var(--no); }
.evs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ev { border: 1px solid color-mix(in srgb, var(--ai) 30%, var(--line)); background: var(--ai-soft); color: var(--ink); border-radius: 6px;
  padding: 2px 8px; font-size: 12px; cursor: pointer; max-width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev b { color: var(--ai); font-weight: 650; margin-right: 4px; }
.skeleton { height: 12px; border-radius: 6px; margin-top: 8px; background: linear-gradient(90deg, var(--line), var(--panel-2), var(--line)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
label.block { display: block; font-weight: 600; margin: 14px 0 6px; }
select, textarea, input[type=search] { width: 100%; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; }
textarea { min-height: 64px; resize: vertical; }
.footer { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn:hover:not(:disabled):not(.primary) { border-color: var(--brand-grey); }
.btn:disabled { opacity: .5; cursor: default; }
.banner.hint { background: var(--ai-soft); color: var(--ai); }
.status { font-size: 12px; color: var(--muted); }
.footer .status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status.dirty { color: var(--warn); } .status.err { color: var(--no); }
kbd { font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

/* Website sign-in (team passcode, then your name) */
.login { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
  background: linear-gradient(180deg, var(--accent-soft), var(--bg)); }
.login[hidden] { display: none; }
.login form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow), inset 0 3px 0 var(--brand); padding: 22px; display: grid; gap: 12px; }
.login h2 { margin: 0; font-size: 17px; }
.login p { margin: 0; color: var(--muted); font-size: 13px; }
.login input[type=password] { width: 100%; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 10px; font: inherit; }
.login .err { color: var(--no); font-size: 13px; min-height: 1.2em; }
.login img { height: 40px; justify-self: start; }
#signout { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }
#signout[hidden] { display: none; }

/* Responsive: browser zoom shrinks the CSS viewport, so these also cover 125-250% zoom. */
@media (max-width: 1280px) { .keys { display: none; } }
@media (max-width: 1100px) {
  .progress .bar, .brand .sub { display: none; }
  header { gap: 10px; padding: 8px 14px; }
  .chip#rater { display: none; }
}
@media (max-width: 1000px) {
  .toolbar .fid { display: none; }
  .toolbar { padding: 8px 14px; }
  #transcript { padding: 12px 14px 20px; }
  .scroll { padding: 10px 12px 12px; }
  .footer { padding: 10px 12px; }
}
/* Short windows (high zoom or small laptop screens): tighten vertical space. */
@media (max-height: 700px) {
  header { padding-top: 6px; padding-bottom: 6px; }
  .brand img { height: 28px; }
  .summary { padding: 8px 10px; margin-bottom: 10px; }
  .coach summary { padding: 6px 14px; }
  .filters { padding: 8px 10px; gap: 6px; }
}
/* Narrow windows (about 200% zoom and up): stack the panels; the page scrolls, Save stays pinned. */
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; }
  .body { grid-template-columns: minmax(0, 1fr); }
  nav { border-right: 0; border-bottom: 1px solid var(--line); }
  #list { max-height: 28vh; }
  #transcript { max-height: 55vh; padding: 12px 14px; }
  aside { border-left: 0; border-top: 1px solid var(--line); display: block; }
  .scroll { overflow: visible; }
  .footer { position: sticky; bottom: 0; z-index: 3; box-shadow: 0 -2px 8px rgba(28,38,23,.08); }
  header { position: sticky; top: 0; z-index: 4; flex-wrap: wrap; padding: 8px 14px; }
  .progress { margin-left: 0; }
}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="login-form" autocomplete="off">
    <img src="/brand/logo" alt="" onerror="this.remove()">
    <h2>Agent Call Analysis</h2>
    <p id="login-help">Enter the team passcode.</p>
    <input type="password" id="login-pass" placeholder="Team passcode" aria-label="Team passcode" autocomplete="current-password">
    <select id="login-name" aria-label="Your name" hidden></select>
    <div class="err" id="login-err" role="alert"></div>
    <button class="btn primary" type="submit" id="login-go">Continue</button>
  </form>
</div>
<div class="app">
  <header>
    <div class="brand">
      <span id="logo-slot"><span class="mono-mark">QA</span></span>
      <div><h1>Call QA Review</h1><div class="sub">Real &amp; synthetic calls</div></div>
    </div>
    <div class="progress"><div class="bar" aria-hidden="true"><div id="barfill"></div></div><span class="status" id="progress"></span></div>
    <span class="spacer"></span>
    <span class="chip" id="aichip"><span class="pulse"></span><span id="aitext">AI</span></span>
    <span class="chip" id="rater"></span>
    <button type="button" id="signout" hidden>Sign out</button>
    <span class="status keys"><kbd>⌘S</kbd> save · <kbd>Alt</kbd><kbd>↑↓</kbd> calls</span>
  </header>
  <div class="body">
    <nav aria-label="Calls">
      <div class="filters">
        <span class="lbl">Calls</span>
        <select id="f-who" aria-label="Filter by assigned rater"></select>
        <div class="ftabs" id="f-source" role="group" aria-label="Filter by source"></div>
        <select id="f-status" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="todo">Not tagged</option>
          <option value="partial">In progress</option>
          <option value="done">Tagged</option>
        </select>
        <input id="f-search" type="search" placeholder="Search call ID…" aria-label="Search call ID">
      </div>
      <div id="list"></div>
      <div class="list-foot" id="list-foot"></div>
    </nav>
    <section class="center">
      <div class="toolbar">
        <input id="find" type="search" placeholder="Search transcript…" aria-label="Search transcript">
        <span class="fid" id="callid"></span>
      </div>
      <div id="senti"></div>
      <div id="transcript" aria-label="Transcript"><div id="summary"></div><div id="turns"></div></div>
      <details class="coach" id="coach" open>
        <summary><span class="caret">▸</span> Agent coaching <span class="count" id="coachcount"></span></summary>
        <div id="tips"></div>
      </details>
    </section>
    <aside>
      <div class="scroll">
        <div class="section-title"><h2>Checklist</h2><span class="status" id="legend"></span></div>
        <div id="banner"></div>
        <div id="items"></div>
        <div class="field" id="sentiment-field">
          <label class="block" style="margin-top:0">Caller sentiment <span class="flag" id="sentiment-flag" hidden></span></label>
          <div id="sentiment"></div><div class="reason" id="sentiment-msg"></div>
        <div class="evs" id="sentiment-ev"></div>
        </div>
        <div class="field" id="outcome-field">
          <label class="block" for="outcome" style="margin-top:0">Call outcome <span class="flag" id="outcome-flag" hidden></span></label>
          <select id="outcome"></select><div class="reason" id="outcome-msg"></div>
        <div class="evs" id="outcome-ev"></div>
        </div>
        <label class="block" for="notes">Notes</label>
        <textarea id="notes" placeholder="Anything ambiguous: why N/A, garbled audio, disagreement with AI…"></textarea>
      </div>
      <div class="footer">
        <button class="btn" id="prev">← Prev</button>
        <button class="btn primary" id="save">Save &amp; next</button>
        <span class="status" id="status"></span>
      </div>
    </aside>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const S = {
  config: null, calls: [], byId: {}, labels: {}, sugg: {}, text: {}, senti: {},
  cur: null, view: [], form: {}, touched: new Set(), dirty: false, active: null, activeSticky: false,
  filter: { who: "mine", source: "all", status: "all", q: "" },
};
const LABEL = {
  greeting: "Appropriate greeting", culture: "Culture & values", capturing_data: "Captures key data",
  understanding_needs: "Understands needs", correct_info: "Correct information",
  first_contact_resolution: "First-contact resolution", compliance: "Privacy compliance", general: "General",
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
const call = () => S.byId[S.cur];
const sugg = () => S.sugg[S.cur];
const turns = () => (S.text[S.cur] || { turns: [] }).turns;

function saveFilter() { try { localStorage.setItem("qa-filter", JSON.stringify(S.filter)); } catch (e) {} }
function loadFilter() { try { Object.assign(S.filter, JSON.parse(localStorage.getItem("qa-filter") || "{}")); } catch (e) {} }

/* ---------- website sign-in ---------- */
async function login(rater) {
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ passcode: $("login-pass").value, rater: rater || "" }) });
  return { ok: r.ok, ...(await r.json().catch(() => ({}))) };
}
function showLogin() {
  $("login").hidden = false;
  $("login-pass").focus();
  $("login-form").onsubmit = async (e) => {
    e.preventDefault();
    $("login-go").disabled = true; $("login-err").textContent = "";
    const pick = $("login-name").hidden ? "" : $("login-name").value;
    const res = await login(pick);
    $("login-go").disabled = false;
    if (!res.ok) { $("login-err").textContent = res.error || "Could not sign in"; return; }
    if (res.raters) {
      $("login-name").innerHTML = `<option value="">Choose your name…</option>` +
        res.raters.map((r) => `<option value="${esc(r)}">${esc(cap(r))}</option>`).join("");
      $("login-name").hidden = false; $("login-pass").hidden = true;
      $("login-help").textContent = "Who's tagging?"; $("login-name").focus();
      return;
    }
    location.reload();
  };
}
$("signout").onclick = () => guard(async () => {
  await fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  S.dirty = false; location.reload();
});

async function load() {
  const resp = await fetch("/api/state");
  if (resp.status === 401) return showLogin();
  const d = await resp.json();
  $("signout").hidden = !d.config.website;
  Object.assign(S, { config: d.config, calls: d.calls, labels: d.labels });
  S.calls.forEach((c) => (S.byId[c.id] = c));
  if (d.config.has_logo) $("logo-slot").innerHTML = `<img src="/brand/logo" alt="Salud Revenue Partners">`;
  $("rater").textContent = "Rater · " + cap(d.config.rater);
  loadFilter();
  buildFilters(); buildForm(); applyFilter();
  const first = S.view.find((id) => status(id) !== "done") || S.view[0] || S.calls[0]?.id;
  if (first) show(first);
}

/* ---------- filters & list ---------- */
function buildFilters() {
  const me = S.config.rater, count = (r) => S.calls.filter((c) => c.assignees.includes(r)).length;
  const who = [{ k: "mine", t: `My calls (${count(me)})` }, { k: "all", t: `All raters (${S.calls.length})` },
    ...S.config.raters.filter((r) => r !== me).map((r) => ({ k: r, t: `${cap(r)} (${count(r)})` }))];
  if (!who.some((o) => o.k === S.filter.who) || (S.filter.who === "mine" && !count(me))) S.filter.who = count(me) ? "mine" : "all";
  $("f-who").innerHTML = who.map((o) => `<option value="${esc(o.k)}">${esc(o.t)}</option>`).join("");
  $("f-who").value = S.filter.who;
  $("f-who").onchange = () => { S.filter.who = $("f-who").value; applyFilter(true); };
  const tabs = [{ key: "all", label: "All" }, ...S.config.sources.map((s) => ({ key: s.key, label: s.label }))];
  if (!tabs.some((t) => t.key === S.filter.source)) S.filter.source = "all";
  $("f-source").innerHTML = tabs.map((t) => {
    const n = t.key === "all" ? S.calls.length : S.calls.filter((c) => c.source === t.key).length;
    return `<button type="button" data-k="${t.key}">${t.label}<span class="n">${n.toLocaleString()}</span></button>`;
  }).join("");
  $("f-source").querySelectorAll("button").forEach((b) => b.onclick = () => { S.filter.source = b.dataset.k; applyFilter(true); });
  $("f-status").value = S.filter.status;
  $("f-search").value = S.filter.q;
  $("f-status").onchange = () => { S.filter.status = $("f-status").value; applyFilter(true); };
  $("f-search").oninput = () => { S.filter.q = $("f-search").value.trim().toLowerCase(); applyFilter(true); };
}

function status(id) {
  const l = S.labels[id]; if (!l) return "todo";
  const keys = [...S.config.items, "sentiment", "outcome"];
  const n = keys.filter((k) => l[k]).length;
  return n === keys.length ? "done" : n ? "partial" : "todo";
}

function applyFilter(userChange) {
  const f = S.filter;
  $("f-source").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === f.source));
  const who = f.who === "mine" ? S.config.rater : f.who;
  S.view = S.calls.filter((c) =>
    (who === "all" || c.assignees.includes(who)) &&
    (f.source === "all" || c.source === f.source) &&
    (f.status === "all" || status(c.id) === f.status) &&
    (!f.q || c.file_id.toLowerCase().includes(f.q))).map((c) => c.id);
  renderList();
  if (userChange) saveFilter();
}

function renderList() {
  const srcLabel = Object.fromEntries(S.config.sources.map((s) => [s.key, s.label]));
  const list = $("list");
  if (!S.view.length) {
    list.innerHTML = `<div class="list-empty">No calls match these filters.</div>`;
  } else {
    list.innerHTML = S.view.map((id) => {
      const c = S.byId[id];
      return `<button type="button" data-id="${esc(id)}" aria-current="${id === S.cur}">
        <span class="src ${c.source}">${esc(srcLabel[c.source] || c.source)}</span>
        <span class="fid" title="${esc(c.file_id)}">${esc(c.file_id.replace(/\.txt$/, "").slice(0, 8))}</span>
        ${S.filter.who === "mine" || !c.assignees.length ? "" : `<span class="who-as" title="Assigned to ${esc(c.assignees.map(cap).join(", "))}">${esc(c.assignees.map((r) => cap(r.slice(0, 2))).join(" · "))}</span>`}
        <span class="dot ${status(id) === "todo" ? "" : status(id)}"></span></button>`;
    }).join("");
    list.querySelectorAll("button").forEach((b) => b.onclick = () => guard(() => show(b.dataset.id)));
  }
  const done = S.view.filter((id) => status(id) === "done").length;
  $("list-foot").textContent = `Showing ${S.view.length.toLocaleString()} of ${S.calls.length.toLocaleString()} calls`;
  $("progress").textContent = `${done.toLocaleString()} of ${S.view.length.toLocaleString()} tagged`;
  $("barfill").style.width = (100 * done / Math.max(1, S.view.length)) + "%";
}

function scrollListToCurrent() {
  const el = $("list").querySelector(`button[aria-current="true"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
}

function neighbour(step) {
  const pos = S.view.indexOf(S.cur);
  if (pos === -1) return S.view[0];
  return S.view[pos + step];
}

/* ---------- checklist form ---------- */
function segButtons(values, key, wide) {
  const wrap = document.createElement("div");
  wrap.className = "seg" + (wide ? " wide" : "");
  wrap.setAttribute("role", "group");
  values.forEach((v) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.k = key; b.dataset.v = v; b.textContent = v;
    b.onclick = (e) => { e.stopPropagation(); S.form[key] = S.form[key] === v ? "" : v; S.touched.add(key); markDirty(); paint(); };
    wrap.appendChild(b);
  });
  return wrap;
}

function buildForm() {
  S.config.items.forEach((k) => {
    const card = document.createElement("div");
    card.className = "card"; card.id = "card-" + k;
    card.innerHTML = `<div class="card-head"><span class="card-name">${LABEL[k]}
      <span class="info" title="${esc(S.config.definitions[k])}">i</span><span class="changed" hidden>changed</span><span class="flag" hidden></span></span></div>
      <div class="reason"></div><div class="evs"></div>`;
    card.querySelector(".card-head").appendChild(segButtons(["Yes", "No", "N/A"], k));
    card.onmouseenter = () => setActive(k);
    card.onclick = () => setActive(k, true);
    $("items").appendChild(card);
  });
  $("sentiment").appendChild(segButtons(S.config.sentiments, "sentiment", true));
  const o = $("outcome");
  o.innerHTML = `<option value="">Select…</option>` + S.config.outcomes.map((x) => `<option value="${x}">${x.replaceAll("_", " ")}</option>`).join("");
  o.onchange = () => { S.form.outcome = o.value; S.touched.add("outcome"); markDirty(); paint(); };
  $("notes").oninput = () => { S.form.notes = $("notes").value; markDirty(); };
}

function suggested(key) {
  const s = sugg(); if (!s || !s.checklist) return null;
  if (key === "sentiment") return s.sentiment?.label || null;
  if (key === "outcome") return s.outcome?.label || null;
  return s.checklist[key]?.answer || null;
}
function evidenceFor(key) {
  const s = sugg(); if (!s || !s.checklist) return [];
  if (key === "sentiment" || key === "outcome") return s[key]?.evidence || [];
  return s.checklist[key]?.evidence || [];
}

function evChips(el, list) {
  el.innerHTML = "";
  list.forEach((ev) => {
    const b = document.createElement("button");
    b.className = "ev"; b.type = "button"; b.title = ev.quote;
    b.innerHTML = `<b>T${ev.turn}</b>“${esc(ev.quote)}”`;
    b.onclick = (e) => { e.stopPropagation(); jumpTo(ev.turn); };
    el.appendChild(b);
  });
}

function setAiChip(state) {
  const chip = $("aichip"), ai = S.config.ai;
  chip.className = "chip";
  if (!ai.model) { chip.classList.add("off"); $("aitext").textContent = "No AI analyses yet"; chip.title = "Run salud-phase1 analyze"; return; }
  chip.classList.add("ai");
  if (state === "loading") chip.classList.add("loading");
  $("aitext").textContent = `AI answers · ${ai.analyzed}/${S.calls.length} calls`;
  chip.title = `From ${ai.file} (${ai.model}, prompt ${ai.prompt_version}). Read-only: saving never changes it.`;
}

function paint() {
  if (!call()) return;
  const s = sugg(), loading = s && s.loading;
  document.querySelectorAll("aside .seg button").forEach((b) => {
    const isSugg = suggested(b.dataset.k) === b.dataset.v;
    b.setAttribute("aria-pressed", S.form[b.dataset.k] === b.dataset.v);
    b.classList.toggle("sugg", isSugg);
    b.title = isSugg ? "AI suggestion" : "";
  });
  S.config.items.forEach((k) => {
    const card = $("card-" + k), r = card.querySelector(".reason"), sg = suggested(k);
    card.querySelector(".changed").hidden = !(sg && S.form[k] && S.form[k] !== sg);
    const st = reviewState(k);
    setFlag(card, card.querySelector(".flag"), k, st);
    if (loading) { r.innerHTML = `<div class="skeleton" style="width:80%"></div>`; card.querySelector(".evs").innerHTML = ""; return; }
    const reason = s?.checklist?.[k]?.reason;
    r.innerHTML = reviewMsg(k, st) + (reason ? `<span class="ai">AI</span> ${esc(reason)}` : "");
    evChips(card.querySelector(".evs"), evidenceFor(k));
  });
  ["sentiment", "outcome"].forEach((k) => {
    const st = loading ? "" : reviewState(k);
    setFlag($(k + "-field"), $(k + "-flag"), k, st);
    $(k + "-msg").innerHTML = reviewMsg(k, st);
  });
  evChips($("sentiment-ev"), evidenceFor("sentiment"));
  evChips($("outcome-ev"), evidenceFor("outcome"));
  $("outcome").value = S.form.outcome || "";
  $("notes").value = S.form.notes || "";
  $("legend").innerHTML = s && s.checklist ? `<span style="color:var(--ai)">●</span> AI suggestion` : "";
  renderBanner(); renderSummary(); renderTips(); highlight();
}

function needsReview(key) {
  // The AI analysed the call but gave no answer, or gave one with no supporting transcript text.
  const s = sugg();
  return !!(s && s.checklist) && (!suggested(key) || evidenceFor(key).length === 0);
}

function reviewState(key) {
  // "need": red until the rater decides; "done": rater picked an answer (now or in an earlier save).
  if (!needsReview(key)) return "";
  const saved = S.labels[S.cur] && S.labels[S.cur][key];
  return (S.touched.has(key) || saved) && S.form[key] ? "done" : "need";
}

function setFlag(box, flag, key, st) {
  box.classList.toggle("needs-review", st === "need");
  box.classList.toggle("checked", st === "done");
  flag.hidden = !st;
  flag.className = "flag " + st;
  flag.textContent = st === "done" ? "Checked by you ✓" : (suggested(key) ? "No evidence" : "AI: no answer");
}

function reviewMsg(key, st) {
  if (st === "need") return `<span class="need-msg">${suggested(key)
    ? "No supporting text in the transcript — please check and choose an answer."
    : "AI couldn't determine this — please choose an answer."}</span>`;
  if (st === "done") return `<span class="done-msg">You reviewed this answer.</span>`;
  return "";
}

function renderBanner() {
  const s = sugg();
  let html = "";
  if (s && s.none) html = `<div class="banner hint">No AI analysis for this call yet. Run <b>salud-phase1 analyze</b>, then reopen this call. You can still tag it yourself.</div>`;
  else if (s && s.checklist) {
    const keys = [...S.config.items, "sentiment", "outcome"].filter((k) => reviewState(k) === "need");
    if (keys.length) {
      const names = keys.map((k) => LABEL[k] || (k === "sentiment" ? "Caller sentiment" : "Call outcome"));
      html += `<div class="banner err-soft">${keys.length} item${keys.length > 1 ? "s" : ""} need${keys.length > 1 ? "" : "s"} your review: ${esc(names.join(", "))}. The AI found no supporting text, so they're shown in red until you choose an answer.</div>`;
    }
    if (s.evidence_check?.dropped) html += `<div class="banner">${s.evidence_check.dropped} AI quote(s) didn't match the transcript and were hidden.</div>`;
  }
  $("banner").innerHTML = html;
}

function renderSummary() {
  const s = sugg();
  $("summary").innerHTML = s && s.summary
    ? `<div class="summary"><span class="tag">AI summary</span><span>${esc(s.summary)}</span></div>` : "";
}

function renderTips() {
  const s = sugg(), el = $("tips");
  if (s && s.none) { el.innerHTML = `<div class="empty">Coaching tips appear once this call has an AI analysis.</div>`; $("coachcount").textContent = ""; return; }
  if (!s || s.loading) { el.innerHTML = `<div class="tips"><div class="tip"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div></div></div>`; $("coachcount").textContent = ""; return; }
  const tips = s.coaching || [];
  $("coachcount").textContent = tips.length ? `· ${tips.length} tip${tips.length > 1 ? "s" : ""}` : "";
  if (!tips.length) { el.innerHTML = `<div class="empty">No coaching tips for this call.</div>`; return; }
  el.innerHTML = `<div class="tips">` + tips.map((t) => `<div class="tip"><div class="meta"><span class="item">${esc(LABEL[t.item] || t.item)}</span>
    ${t.turn ? `<button type="button" data-turn="${t.turn}">Go to T${t.turn} →</button>` : ""}</div>${esc(t.tip)}</div>`).join("") + `</div>`;
  el.querySelectorAll("button[data-turn]").forEach((b) => b.onclick = () => jumpTo(+b.dataset.turn));
}

/* ---------- transcript ---------- */
function renderTranscript() {
  $("turns").innerHTML = turns().map((t) => {
    const kind = /^agent/i.test(t.speaker) ? "agent" : (/automated|system|note/i.test(t.speaker) ? "system" : "caller");
    return `<div class="turn ${kind}" id="turn-${t.n}"><div class="tn">T${t.n}</div><div class="bubble">
      ${t.speaker !== "Note" ? `<div class="who">${esc(t.speaker)}</div>` : ""}<div class="txt"></div></div></div>`;
  }).join("");
  highlight();
  tintTurns();
}

/* ---------- turn sentiment (local: salud-sentiment run) ---------- */
const fmt = (x) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(2);
const sColor = (x) => Math.abs(x) < 0.15 ? "var(--line)"
  : `color-mix(in srgb, var(${x > 0 ? "--pos" : "--neg"}) ${Math.round(35 + 65 * Math.min(1, Math.abs(x)))}%, var(--line))`;

async function loadSentiment(id) {
  if (!(id in S.senti)) {
    try { S.senti[id] = await (await fetch("/api/sentiment?id=" + encodeURIComponent(id))).json(); }
    catch (e) { S.senti[id] = { none: true }; }
  }
  if (S.cur === id) { renderSentiment(); tintTurns(); }
}

function tintTurns() {
  const d = S.senti[S.cur]; if (!d || d.none) return;
  d.turns.forEach((t) => {
    const el = $("turn-" + t.turn); if (!el) return;
    el.classList.add("scored"); el.style.setProperty("--tint", sColor(t.score));
    const who = el.querySelector(".who");
    if (who && !who.querySelector(".sscore")) who.insertAdjacentHTML("beforeend",
      `<span class="sscore ${Math.abs(t.score) < 0.15 ? "neu" : t.score > 0 ? "pos" : "neg"}"
        title="Sentiment ${fmt(t.score)} (${esc(t.label)}), strength ${t.magnitude.toFixed(2)}">${fmt(t.score)}</span>`);
  });
}

function renderSentiment() {
  const el = $("senti"), d = S.senti[S.cur];
  if (!d || d.none || !d.call || !d.call.caller_turns) { el.innerHTML = ""; return; }
  const c = d.call, n = Math.max(c.call_turns, 2);
  const word = (l) => cap(l || "");
  el.innerHTML = `<div class="senti-head">
      <span class="tag" title="Local model (${esc(d.model || "")}), display only: not part of your tags">Caller sentiment</span>
      <span class="big" style="color:${Math.abs(c.caller_end) < 0.15 ? "var(--muted)" : `var(${c.caller_end > 0 ? "--pos" : "--neg"})`}">Ended ${esc(word(c.caller_end_label))} (${fmt(c.caller_end)})</span>
      <span class="muted">Started ${fmt(c.caller_start)} · Shift ${fmt(c.caller_shift)} · Overall ${esc(c.caller_label)} (${fmt(c.caller_overall)})</span>
      <span class="right"><span class="key"><i></i>Caller</span><span class="key"><i class="agent"></i>Agent</span>
        <button type="button" data-turn="${c.caller_min_turn}">Lowest T${c.caller_min_turn} (${fmt(c.caller_min_score)}) →</button>
        <button type="button" data-turn="${c.caller_max_turn}">Highest T${c.caller_max_turn} (${fmt(c.caller_max_score)}) →</button></span></div>
    <div class="senti-chart" id="senti-chart"></div>`;
  // Drawn at the panel's real width so the strip stays a fixed, short height.
  const W = Math.max($("senti-chart").clientWidth - 28, 200), H = 46, P = 5;   // 28: the chart's side padding
  const x = (turn) => P + (W - 2 * P) * (turn - 1) / (n - 1), y = (v) => H / 2 - (H / 2 - P) * v;
  const line = (role) => d.turns.filter((t) => t.role === role).map((t) => `${x(t.turn).toFixed(1)},${y(t.score).toFixed(1)}`).join(" ");
  const dots = d.turns.filter((t) => t.role === "caller").map((t) =>
    `<circle cx="${x(t.turn).toFixed(1)}" cy="${y(t.score).toFixed(1)}" r="3.6" style="fill:${sColor(t.score)};stroke:var(--panel);stroke-width:1.2" data-turn="${t.turn}"><title>T${t.turn}: ${fmt(t.score)}</title></circle>`).join("");
  $("senti-chart").innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Caller sentiment over the call, turn by turn">
      <line x1="${P}" x2="${W - P}" y1="${y(0)}" y2="${y(0)}" style="stroke:#cfd6c6;stroke-width:1"/>
      <polyline points="${line("agent")}" style="fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 3;opacity:.8"/>
      <polyline points="${line("caller")}" style="fill:none;stroke:var(--ink);stroke-width:2.2;opacity:.8"/>
      ${dots}</svg>`;
  el.querySelectorAll("[data-turn]").forEach((b) => b.onclick = () => jumpTo(+b.dataset.turn));
}
window.addEventListener("resize", () => { clearTimeout(window._sentiT); window._sentiT = setTimeout(renderSentiment, 120); });

function setActive(k, sticky) {
  if (!sticky && S.activeSticky) return;
  S.active = k; S.activeSticky = !!sticky;
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("active", c.id === "card-" + k));
  highlight();
  if (sticky) { const ev = evidenceFor(k)[0]; if (ev) jumpTo(ev.turn); }
}

function highlight() {
  const evs = S.active ? evidenceFor(S.active) : [];
  const q = $("find").value.trim();
  const findRe = q ? new RegExp("(" + reEsc(esc(q)) + ")", "gi") : null;
  turns().forEach((t) => {
    const el = $("turn-" + t.n); if (!el) return;
    let html = esc(t.text);
    const mine = evs.filter((e) => e.turn === t.n);
    mine.forEach((e) => {
      const re = new RegExp(reEsc(esc(e.quote)).replace(/\s+/g, "\\s+"), "i");
      if (re.test(html)) html = html.replace(re, (m) => `<mark>${m}</mark>`);
    });
    if (findRe) html = html.replace(findRe, `<mark class="find">$1</mark>`);
    el.querySelector(".txt").innerHTML = html;
    el.classList.toggle("cited", mine.length > 0);
  });
}

function jumpTo(n) {
  const el = $("turn-" + n); if (!el) return;
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
}

/* ---------- AI ---------- */
async function loadAI(id) {
  // The script's saved analysis for this call (ai_analyses.json, read-only). Never calls the LLM.
  if (S.sugg[id] && !S.sugg[id].none) { applySuggestion(id); return; }
  S.sugg[id] = { loading: true }; setAiChip("loading"); paint();
  let res;
  try { res = await (await fetch("/api/analysis?id=" + encodeURIComponent(id))).json(); } catch (e) { res = {}; }
  S.sugg[id] = res && res.checklist ? res : { none: true };
  if (S.cur === id) { setAiChip(); applySuggestion(id); }
}

function applySuggestion(id) {
  const s = S.sugg[id];
  if (!s || !s.checklist) { paint(); return; }
  // Fill only fields that are still empty: the rater's own choices are never overwritten.
  const fill = { ...Object.fromEntries(S.config.items.map((k) => [k, s.checklist[k]?.answer])),
                 sentiment: s.sentiment?.label, outcome: s.outcome?.label };
  let n = 0;
  for (const [k, v] of Object.entries(fill)) if (v && !S.form[k]) { S.form[k] = v; n++; }
  if (n && !S.dirty) { $("status").textContent = "AI answers loaded · check, correct and save"; $("status").className = "status"; }
  paint();
}

/* ---------- navigation & saving ---------- */
async function show(id) {
  S.cur = id; S.active = null; S.activeSticky = false; S.touched = new Set();
  const c = call();
  S.form = { ...(S.labels[id] || {}) };
  S.dirty = false;
  $("callid").textContent = c.file_id;
  $("status").textContent = status(id) === "done" ? "Saved" : ""; $("status").className = "status";
  document.querySelectorAll(".card").forEach((el) => el.classList.remove("active"));
  renderList(); scrollListToCurrent(); setAiChip();
  if (!S.text[id]) {
    $("turns").innerHTML = `<div class="skeleton" style="max-width:820px"></div><div class="skeleton" style="max-width:600px"></div>`;
    S.text[id] = await (await fetch("/api/call?id=" + encodeURIComponent(id))).json();
    if (S.cur !== id) return;
  }
  $("transcript").scrollTop = 0;
  renderTranscript(); renderSentiment(); paint();
  loadAI(id); loadSentiment(id);
}

function markDirty() { S.dirty = true; $("status").textContent = "Unsaved changes"; $("status").className = "status dirty"; }
function guard(fn) { if (S.dirty && !confirm("Discard unsaved changes on this call?")) return; fn(); }

async function save(advance) {
  const id = S.cur, s = sugg();
  const llm = s && s.checklist ? { model: s.model, answers: {
    ...Object.fromEntries(S.config.items.map((k) => [k, s.checklist[k]?.answer || ""])),
    sentiment: s.sentiment?.label || "", outcome: s.outcome?.label || "" } } : null;
  $("save").disabled = true;
  const r = await fetch("/api/label", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, values: S.form, llm }) });
  $("save").disabled = false;
  if (!r.ok) { const e = await r.json().catch(() => ({})); $("status").textContent = r.status === 401 ? "Save failed: your sign-in expired. Reload to sign in again." : "Save failed: " + (e.error || r.status); $("status").className = "status err"; return; }
  const next = neighbour(1);
  S.labels[id] = { ...S.form }; S.dirty = false;
  $("status").textContent = "Saved"; $("status").className = "status";
  applyFilter();   // a status filter may now hide this call
  if (advance && next) show(next); else renderList();
}

$("save").onclick = () => save(true);
$("prev").onclick = () => guard(() => { const p = neighbour(-1); if (p) show(p); });
$("find").oninput = highlight;
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(false); }
  if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); guard(() => { const n = neighbour(1); if (n) show(n); }); }
  if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); guard(() => { const p = neighbour(-1); if (p) show(p); }); }
});
window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
if (innerHeight < 560) $("coach").open = false;
load();
</script>
</body>
