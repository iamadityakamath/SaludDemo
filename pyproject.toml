[project]
name = "salud-pipeline"
version = "0.1.0"
description = "UIUC BIG Team B - Salud call QA and payment propensity pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Turn-level call sentiment (salud-sentiment). Not in requirements.txt: the Vercel site doesn't run the model.
sentiment = ["transformers>=4.44", "torch>=2.3"]

[project.scripts]
salud-phase1 = "salud_pipeline.phase1.cli:main"
salud-db = "salud_pipeline.db:main"
salud-synth = "salud_pipeline.phase2.synthetic.cli:main"
salud-sentiment = "salud_pipeline.sentiment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salud_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
