[project]
name = "salud-pipeline"
version = "0.1.0"
description = "UIUC BIG Team B - Salud call QA and payment propensity pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
salud-synth = "salud_pipeline.synth.cli:main"
salud-qa = "salud_pipeline.qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salud_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
