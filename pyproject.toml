[project]
name = "salud-pipeline"
version = "0.1.0"
description = "UIUC BIG Team B - Salud call QA and payment propensity pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # Sentiment model (int8 ONNX), run by the dashboard's Analyze and salud-sentiment
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Propensity modelling notebooks (Phase 2/notebooks/): uv pip install -e '.[dev,model]'
model = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.46",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[project.scripts]
salud-phase1 = "salud_pipeline.phase1.cli:main"
salud-db = "salud_pipeline.db:main"
salud-synth = "salud_pipeline.phase2.synthetic.cli:main"
salud-synth-calibrate = "salud_pipeline.phase2.synthetic.calibrate:main"
salud-sentiment = "salud_pipeline.sentiment.cli:main"
salud-propensity = "salud_pipeline.phase2.propensity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salud_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
