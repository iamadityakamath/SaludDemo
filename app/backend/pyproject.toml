[project]
name = "salud-app-backend"
version = "0.1.0"
description = "FastAPI backend for the Salud app: agent call reviews (Phase 1) and payment propensity (Phase 2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salud_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
